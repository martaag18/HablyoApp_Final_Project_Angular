<article
  class="exercise-wrapper bg-gray-50 w-full p-4 rounded shadow"
  role="region"
  aria-labelledby="exercise-title"
>
  <!-- Hidden heading for screen readers -->
  <h2
    id="exercise-title"
    class="sr-only"
  >
    Ejercicio con iconos de acento, arco, P y subrayado
  </h2>

  <!-- Header with icons (Accent, Arc, P, Underline) -->
  <header class="mb-4 flex items-center gap-4">
    <!-- Accent Icon -->
    <app-accent-icon
      (dragStarted)="onDragStart($event, '´')"
      aria-label="Icono de tilde"
      role="button"
    ></app-accent-icon>

    <!-- Arc Icon -->
    <app-arc-icon
      (dragStarted)="onDragStart($event, 'arc')"
      aria-label="Icono de arco"
      role="button"
    ></app-arc-icon>

    <!-- P Icon -->
    <app-p-icon
      (dragStarted)="onDragStart($event, 'P')"
      aria-label="Icono de P"
      role="button"
    ></app-p-icon>

    <!-- Underline Icon -->
    <app-underline-icon
      (dragStarted)="onDragStart($event, 'underline')"
      aria-label="Icono de subrayado"
      role="button"
    ></app-underline-icon>
  </header>

  <!-- Main section for letters -->
  <section
    class="scroll-outer"
    aria-label="Contenido principal del ejercicio"
  >
    <div
      class="letters-scale"
      [ngClass]="{
        'short-phrase': wordList.length <= 3,
        'long-phrase': wordList.length > 3
      }"
    >
      <!-- Word loop -->
      @for (word of wordList; track $index) {
        <span class="inline-flex items-end">
          <!-- Letter loop -->
          @for (letter of word.letters; track $index) {
            <app-letter-container
              [char]="letter.char"
              [globalIndex]="letter.globalIndex"

              [resultStateAccent]="resultAccent[letter.globalIndex]"
              [hasAccent]="accentMark[letter.globalIndex] === '´'"
              (droppedOnAccent)="onDropAccent($event, letter.globalIndex)"

              [resultStateP]="resultP[letter.globalIndex]"
              [hasP]="pMark[letter.globalIndex] === 'P'"
              (droppedOnP)="onDropP($event, letter.globalIndex)"

              [underlineValue]="underlineMark[letter.globalIndex]"
              [resultUnderline]="resultUnderline[letter.globalIndex]"
              [showUnderlineDropzone]="doubleVocalIndices.includes(letter.globalIndex)"
              (droppedOnUnderline)="onDropUnderline($event, letter.globalIndex)"
            ></app-letter-container>
          }
        </span>

        <!-- Arc Dropzone between words (only if not the last word) -->
        @if ($index < wordList.length - 1) {
          <app-arc-dropzone
            [arcValue]="arcMark[$index]"
            [resultState]="resultArc[$index]"
            (droppedOnArc)="onDropArc($event, $index)"
            aria-label="Zona de drop para arco"
          ></app-arc-dropzone>
        }
      }
    </div>
  </section>
  
  <!-- Footer with instructions -->
  <footer
    class="mt-10"
    aria-label="Instrucciones del ejercicio"
  >
    <app-instructions-footer>
      <br>Arrastra <strong>P</strong> sobre la letra correspondiente.
      <br>Arrastra <strong>_</strong> debajo de la letra correspondiente.
    </app-instructions-footer>
  </footer>
</article>
