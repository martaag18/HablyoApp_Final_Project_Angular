<section
  class="relative min-h-[45vh] bg-gradient-to-r from-primary to-red-300 text-white py-10 overflow-hidden"
  role="region"
  aria-labelledby="hero-heading"
>
  <!-- Hidden heading for screen readers to label this region -->
  <h2
    id="hero-heading"
    class="sr-only"
  >
    Sección de portada
  </h2>

  <div
    class="mx-auto w-full max-w-[1800px] p-6 flex flex-col md:flex-row items-center"
  >
    <!-- Text column -->
    <div class="md:w-3/5 text-center md:text-left md:mr-8">
      <h1 class="text-5xl md:text-6xl font-bold tracking-widest mb-14">
        {{ heroData.title }}
        <span class="text-yellow-100">{{ heroData.highlight }}</span>
      </h1>
      <p class="mt-4 text-xl md:text-2xl tracking-widest">
        {{ heroData.subtitle }}
      </p>
    </div>

    <!-- Image column -->
    <div class="md:w-2/5 mt-10 md:mt-0 flex justify-center md:justify-end">
      <img
        [ngSrc]="heroData.imageSrc"
        [alt]="heroData.imageAlt"
        width="800"
        height="800"
        class="w-full max-w-2xl rounded-xl"
        [priority]="true"
      />
    </div>
  </div>

  <!-- Scroll arrow  -->
  <div
    class="absolute bottom-6 left-1/2 transform -translate-x-1/2 animate-bounce"
    aria-hidden="true"
  >
    <i class="fa-solid fa-chevron-down text-white text-2xl"></i>
  </div>
</section>
