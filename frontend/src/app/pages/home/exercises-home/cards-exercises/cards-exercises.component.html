<!-- Grid container for exercise cards -->
<div
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-20"
  role="list"
  aria-label="Lista de ejercicios disponibles"
>
  <!-- Loop through exerciseCards array -->
  @for (card of exerciseCards; track $index) {
    <!-- Each card as an article with routerLink -->
    <article
      [routerLink]="getCardRoute(card)"
      role="listitem"
      [attr.aria-label]="'Ir al ejercicio de nivel ' + card.level + ': ' + card.title"
      class="relative bg-gray-100 rounded-lg p-8 shadow w-full h-full flex flex-col transition-all duration-300 ease-in-out hover:shadow-2xl hover:bg-gray-50 hover:-translate-y-1 cursor-pointer"
    >
      <!-- Level badge -->
      <span
        class="absolute top-4 left-4 text-xl bg-teal-600 text-white font-bold py-3 px-4 rounded-full shadow"
      >
        Nivel {{ card.level }}
      </span>

      <!-- Exercise title -->
      <h3
        class="flex text-center justify-center text-4xl font-extrabold text-primary mt-12 mb-6 tracking-widest"
      >
        {{ card.title }}
      </h3>
    </article>
  }
</div>
