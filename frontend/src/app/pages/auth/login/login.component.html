<!-- Main container (role="main" to indicate primary content) -->
<div
  class="flex flex-col items-center justify-center min-h-screen bg-white p-4"
  role="main"
  aria-labelledby="login-title"
>
  <div
    class="w-full max-w-md sm:max-w-lg md:max-w-2xl bg-gradient-to-r from-primary to-red-300 rounded-3xl shadow-2xl overflow-hidden p-6 sm:p-8 md:p-12"
  >
    <!-- Page title  -->
    <h2
      id="login-title"
      class="text-xl sm:text-2xl md:text-4xl font-bold text-center mb-12 text-white uppercase"
    >
      👤 Iniciar Sesión
    </h2>

    <!-- Login form (submit is handled by (ngSubmit)) -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()">
      <!-- Email field -->
      <app-text-input
        [control]="loginForm.controls.email"
        label="Email"
        placeholder="Email"
        type="email"
      ></app-text-input>

      <!-- Password field -->
      <app-text-input
        [control]="loginForm.controls.password"
        label="Contraseña"
        placeholder="Contraseña"
        type="password"
      ></app-text-input>

      <!-- Login button -->
      <app-my-button
        label="ACCEDER"
        color="secondary"
        [disabled]="loginForm.invalid"
        [buttonType]="'submit'"
      >
      </app-my-button>
    </form>

    <!-- Error message (role="alert" for immediate announcement) -->
    @if (loginError) {
      <div
        class="bg-red-50 border-l-4 border-red-400 text-red-700 p-2 rounded-md mt-2"
        role="alert"
        aria-live="assertive"
      >
        {{ loginError }}
      </div>
    }

    <!-- Additional links  -->
    <div class="mt-4 text-center">
      <a
        routerLink="/forgot-password"
        class="text-white text-xl underline cursor-pointer"
      >
        ¿Olvidaste tu contraseña?
      </a>
      <p class="text-white text-xl mt-2">
        ¿No tienes cuenta?
        <a routerLink="/forgot-password" class="underline text-xl cursor-pointer">
          Regístrate
        </a>
      </p>
    </div>
  </div>
</div>
