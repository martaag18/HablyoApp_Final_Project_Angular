<footer class="bg-slate-700 text-white py-6 px-8">
  <div class="container mx-auto flex flex-col md:flex-row items-center justify-between gap-6">

    <!-- POLICY LINKS -->
    <div class="order-3 md:order-3 flex flex-col gap-2 text-center md:text-left">
      @for(link of policyLinks; track $index){
        <a
          [routerLink]="link.url"
          class="hover:underline cursor-pointer"
        >
          {{ link.label }}
        </a>
      }
    </div>

    <!-- LOGO + CONTACT INFO -->
    <div class="order-2 flex flex-col items-center gap-4">
      <img
        ngOptimizedImage
        [src]="logoUrl"
        alt="Hablyo Logo"
        class="h-20 cursor-pointer"
      />
      <!-- CONTACT DETAILS -->
      <p class="text-xl">
        <a
          [href]="websiteUrl"
          class="hover:underline cursor-pointer text-white"
        >
          {{ websiteUrl }}
        </a>
      </p>
      <p class="text-xl">
        <a
          [href]="'mailto:' + email"
          class="hover:underline cursor-pointer text-white"
        >
          {{ email }}
        </a>
      </p>
    </div>

    <!-- SOCIAL MEDIA -->
    <div class="order-1 flex items-center gap-3">
      <a
        [href]="instagramUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="cursor-pointer flex items-center justify-center hover:scale-110 transition-transform duration-200"
      >
        <i class="fab fa-instagram text-5xl text-pink-400 hover:text-pink-500"></i>
      </a>
    </div>

  </div>
</footer>
