<nav class="bg-white px-6 py-4 border-b fixed top-0 left-0 w-full z-50">
  <!-- Mobile screens -->
  <div class="flex w-full items-center lg:hidden">
    <!-- Hamburger menu -->
    <div class="mr-auto relative">
      <!-- Button to open/close menu -->
      <button (click)="toggleMenu()" class="btn bg-primary cursor-pointer hover:bg-teal-400">
        <i class="fas fa-bars text-white"></i>
      </button>
      <!-- Dropdown menu -->
      @if(isMenuOpen){
        <ul class="absolute bg-white rounded-box shadow p-4 w-52 mt-2 space-y-4">
          @for(link of mobileMenuLinks; track $index){
            <li>
              <a
                [routerLink]="link.routerLink"
                class="title-link text-lg text-primary hover:border-b-2 hover:border-teal-400 pb-1 transition-all duration-100 cursor-pointer"
              >
                @if(link.icon){
                  <i class="{{ link.icon }} mr-2"></i>
                }
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      }
    </div>
    <!-- Logo -->
    <div class="ml-auto">
      <img
        ngOptimizedImage
        [src]="logoUrl"
        alt="Hablyo Logo"
        class="h-12"
      />
    </div>
  </div>

  <!-- Large screens -->
  <div class="hidden lg:flex w-full items-center justify-between">
    <!-- Main links -->
    <div class="flex gap-10 text-2xl">
      @for(link of mainLinks; track $index){
        <a
          [routerLink]="link.routerLink"
          class="title-link font-bold text-primary hover:border-b-2 hover:border-teal-400 pb-1 transition-all duration-100 cursor-pointer"
        >
          {{ link.label }}
        </a>
      }
    </div>
    <!-- Logo -->
    <div>
      <img
        ngOptimizedImage
        [src]="logoUrl"
        alt="Hablyo Logo"
        class="h-24"
      />
    </div>
    <!-- Auth links -->
    <div class="flex gap-10 text-2xl">
      @if(authService.isLoggedSignal()){
        <a
          (click)="logout()"
          class="title-link font-bold text-primary hover:border-b-2 hover:border-teal-400 pb-1 transition-all duration-100 cursor-pointer"
        >
          CERRAR SESIÓN
        </a>
      } @else {
        <a
          routerLink="/login"
          class="title-link font-bold text-primary hover:border-b-2 hover:border-teal-400 pb-1 transition-all duration-100 cursor-pointer"
        >
          <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> INICIAR SESIÓN
        </a>
      }
      <a
        routerLink="/registro-usuario"
        class="title-link font-bold text-primary hover:border-b-2 hover:border-teal-400 pb-1 transition-all duration-100 cursor-pointer"
      >
        <i class="fas fa-user mr-2"></i> REGISTRO
      </a>
    </div>
  </div>
</nav>
