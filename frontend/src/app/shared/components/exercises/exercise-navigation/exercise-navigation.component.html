<!-- Container for navigation buttons -->
<div
  class="flex gap-2"
  role="group"
  [attr.aria-label]="'Navegación del ejercicio'"
>
  <!-- Next button -->
  <app-my-button
    label="Siguiente"
    color="secondary"
    (clicked)="next.emit()"
  >
  </app-my-button>

  <!-- Previous button (conditionally displayed) -->
  @if (showPrevious) {
    <app-my-button
      label="Anterior"
      color="secondary"
      (clicked)="previous.emit()"
    >
    </app-my-button>
  }
</div>
