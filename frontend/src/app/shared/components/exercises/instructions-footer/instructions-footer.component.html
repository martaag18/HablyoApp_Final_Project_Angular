<!-- Color legend and instructions -->
<small
  class="text-gray-400 block mt-4 text-xl"
  role="note"
  [attr.aria-label]="'Leyenda de colores y acciones'"
>
  <!-- Color legend -->
  <span class="inline-block">
    <span class="bg-green-200 px-1 rounded">Verde</span> = correcto,
    <span class="bg-red-200 px-1 rounded">rojo</span> = incorrecto,
    <span class="bg-yellow-200 px-1 rounded">amarillo</span> = falta.
  </span>
  
  <!-- Instructions -->
  <br /><br />
  Arrastra <strong>´</strong> sobre la letra correspondiente.
  <br />
  Arrastra <strong>∿</strong> debajo de la unión de palabras correspondiente.

  <!-- Slot for additional content -->
  <ng-content></ng-content>
</small>
