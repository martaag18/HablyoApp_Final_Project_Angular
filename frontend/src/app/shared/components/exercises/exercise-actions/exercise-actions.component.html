<!-- Container for exercise actions -->
<div
  class="flex gap-4 flex-wrap"
  role="group"
  [attr.aria-label]="'Acciones del ejercicio'"
>
  <!-- Completed button -->
  <app-my-button
    label="Completado"
    color="success"
    (clicked)="complete.emit()"
  >
  </app-my-button>

  <!-- Show solution button -->
  <app-my-button
    label="Ver solución"
    color="tertiary"
    (clicked)="solve.emit()"
  >
  </app-my-button>

  <!-- Restart button -->
  <app-my-button
    label="Volver a empezar"
    color="blueLight"
    (clicked)="restart.emit()"
  >
  </app-my-button>

  
</div>
