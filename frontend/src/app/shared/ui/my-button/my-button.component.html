@if(routerLink){
<a
  [routerLink]="routerLink"
  [ngClass]="computeClasses()"
  [class.pointer-events-none]="disabled"
  (click)="onClick()"
>
  {{ label }}
</a>
}@else {
<button 
[disabled]="disabled" 
[ngClass]="computeClasses()" 
(click)="onClick()"
[attr.type]="buttonType"

>
  {{ label }}
</button>
}
