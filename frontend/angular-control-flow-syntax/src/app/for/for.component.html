<ul>
    <li *ngFor="let name of names">{{name}}</li> 
</ul>

<!-- control flow syntax (nuevo) -->

<ul>
    @for(name of names; track name){
        <li>{{name}}</li>
    } @empty {
        <li>No names</li>
    }
    <!-- empty lo usaremos en caso de que Angular vea que el array está vacío.  -->
</ul>
